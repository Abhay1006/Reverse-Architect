name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run, so an older run can
# never finish last and move the deploy branch back to an older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, dead code, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run knip
      - run: pnpm test
      - run: pnpm run build
      - name: shellcheck
        run: shellcheck scripts/*.sh

  benchmark:
    name: Accuracy benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Score the labelled corpus
        run: pnpm --silent bench --runs 1 | tee -a "$GITHUB_STEP_SUMMARY"

  package:
    # The published CLI promises Node 20.12+ (development needs 22), so the
    # tarball is built once and installed on each supported runtime.
    name: npm package on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.12', 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack
        run: pnpm --filter ./backend pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install the tarball into an empty project and analyze a corpus
        run: |
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/reverse-architect-*.tgz
          npx reverse-architect --version
          npx reverse-architect cycles "$GITHUB_WORKSPACE/bench/corpus/ts-shop" --json | jq -e '.total == 1'

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Continuous delivery for the self-hosted tablet. Once a push to main passes
  # every job above, point the `deploy` branch at that commit. The tablet runs
  # scripts/tab-deploy.sh, which watches `deploy`, so it only ever pulls
  # commits that passed CI. See docs/TAB-DEPLOY.md.
  promote:
    name: Promote to the deploy branch
    needs: [check, benchmark, package, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Move deploy to this commit
        run: |
          git push --force origin "${GITHUB_SHA}:refs/heads/deploy"
          echo "Promoted \`${GITHUB_SHA::12}\` to \`deploy\`; the tablet picks it up on its next check." >>"$GITHUB_STEP_SUMMARY"
