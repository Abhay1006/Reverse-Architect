name: Remote Deploy to Termux Tablet

on:
  push:
    branches:
      - main # Triggers when you push code to your original repo

jobs:
  # Gate the deploy on a green build. Previously every push went straight to
  # SSH regardless of whether the code compiled or the tests passed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npm run typecheck -w backend
          npm run typecheck -w frontend

      - name: Lint
        run: npm run lint -w frontend

      - name: Test
        run: |
          npm test -w backend
          npm test -w frontend

      - name: Build
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cloudflare CLI on Runner
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Deploy via SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ProxyCommand="cloudflared access ssh --hostname %h" -p 22 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            # 1. Navigate to your app directory inside Termux
            # UPDATE THIS PATH to your exact directory on the tablet if it's different!
            cd ~/Reverse-Architect

            # 2. Sync your tablet's local clone with your original source repo.
            # --ff-only so a divergent local tree fails loudly instead of
            # hanging the SSH session on an interactive merge.
            git pull --ff-only https://github.com/Abhay1006/Reverse-Architect.git main

            # 3. Install and build. The backend now emits dist/ via tsc, so the
            # root build covers both workspaces.
            npm ci
            npm run build

            # 4. Restart under pm2. Note the single `--name` flag: the previous
            # `-- name` form passed "name" as a positional argument.
            pm2 restart reverse-architect --update-env || pm2 start npm --name reverse-architect -- start
            pm2 save
          EOF

      - name: Remove deploy key from runner
        if: always()
        run: shred -u ~/.ssh/id_rsa || rm -f ~/.ssh/id_rsa

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ secrets.HEALTHCHECK_URL || 'http://localhost:4000/api/health' }}"; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting for backend to come up ($i/10)..."
            sleep 6
          done
          echo "Health check failed — the deploy may have left the service down."
          exit 1
        continue-on-error: true
