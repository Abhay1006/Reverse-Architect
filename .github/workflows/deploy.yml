name: Remote Deploy to Termux Tablet

on:
  push:
    branches:
      - main # Triggers when you push code to your original repo

jobs:
  # Gate the deploy on a green build. Previously every push went straight to
  # SSH regardless of whether the code compiled or the tests passed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npm run typecheck -w backend
          npm run typecheck -w frontend

      - name: Lint
        run: npm run lint -w frontend

      - name: Test
        run: |
          npm test -w backend
          npm test -w frontend

      - name: Build
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be referenced in a step-level `if:` — doing so made
      # GitHub reject this whole workflow file, so no job ever ran. Expose the
      # value as an env var and test that instead.
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cloudflare CLI on Runner
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Deploy via SSH over Cloudflare Tunnel
        env:
          # A token the tablet can fetch with. GITHUB_TOKEN is scoped to this
          # repository and expires with the run, which is enough for a private
          # clone; set DEPLOY_PAT only if you need broader access. The old
          # bare https:// URL failed outright once the repo went private.
          GIT_TOKEN: ${{ secrets.DEPLOY_PAT || secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ secrets.APP_DIR || '~/Reverse-Architect' }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          # The tablet's SSH host key, one known_hosts line for SSH_HOST.
          # Copy it from a machine that has connected before:
          #   ssh-keygen -F <SSH_HOST> -f ~/.ssh/known_hosts
          # Pinning it is what stops anyone between the runner and the tablet
          # from impersonating it — StrictHostKeyChecking=no accepted any key.
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::The SSH_KNOWN_HOSTS secret is not set. Add the tablet's host key (see the comment in this step) so the deploy can verify it."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # The token is passed through the remote shell's environment rather
          # than baked into the script or a remote URL, so it never lands in
          # the tablet's .git/config, reflog, or shell history.
          ssh -i ~/.ssh/id_rsa \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              -p 22 \
              "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
              "GIT_TOKEN='$GIT_TOKEN' APP_DIR='$APP_DIR' REPO_URL='$REPO_URL' bash -s" << 'EOF'
            set -euo pipefail

            # 1. Navigate to the app directory on the tablet.
            #    Override with the APP_DIR repository secret if it differs.
            cd "${APP_DIR/#\~/$HOME}"

            # 2. Point origin at the HTTPS URL. The token below is sent as a
            #    header, which only applies to HTTPS remotes — if the tablet's
            #    origin were an SSH URL the header would be silently ignored.
            git remote set-url origin "$REPO_URL" 2>/dev/null \
              || git remote add origin "$REPO_URL"

            # 3. Fetch using an Authorization header rather than a credentialed
            #    URL. `git -c` applies it to this command only — nothing is
            #    persisted to .git/config.
            AUTH_HEADER="Authorization: Basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"

            git -c http.extraHeader="$AUTH_HEADER" \
                fetch --prune origin main

            # 4. A deploy target should mirror origin exactly. reset --hard
            # discards any edits made directly on the tablet, which is the
            # intended behaviour here — do development elsewhere.
            git checkout -B main origin/main
            git reset --hard origin/main

            # 5. Install and build. The backend emits dist/ via tsc, so the
            #    root build covers both workspaces.
            npm ci
            npm run build

            # 6. Restart under pm2. Note the single `--name` flag: the previous
            #    `-- name` form passed "name" as a positional argument.
            pm2 restart reverse-architect --update-env || pm2 start npm --name reverse-architect -- start
            pm2 save
          EOF

      - name: Remove deploy key from runner
        if: always()
        run: shred -u ~/.ssh/id_rsa 2>/dev/null || rm -f ~/.ssh/id_rsa

      # Runs on the GitHub runner, so it needs a URL reachable from the public
      # internet — set the HEALTHCHECK_URL secret to your tunnel hostname.
      # Skipped entirely when that secret is absent, rather than pretending to
      # check the runner's own localhost.
      - name: Health check
        if: env.HEALTHCHECK_URL != ''
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "$HEALTHCHECK_URL"; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting for backend to come up ($i/10)..."
            sleep 6
          done
          echo "::error::Health check failed — the deploy may have left the service down."
          exit 1
