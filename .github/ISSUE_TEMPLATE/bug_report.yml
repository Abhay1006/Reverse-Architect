name: Bug report
description: Something crashes, hangs or behaves wrongly (other than an analysis result).
labels: ["bug"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Web app, CLI, MCP server, Install / build]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx reverse-architect analyze https://github.com/...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
      description: Include error output. Run with `2>&1` so stderr is captured.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: reverse-architect 0.1.0, Node 22.x, macOS 15 / Ubuntu 24.04 / Windows 11
    validations:
      required: true
